services:
  - type: web
    name: aits-floorplan-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AITS_HOSTED
        value: "true"
      - key: AITS_ALLOWED_ORIGIN
        value: https://aitscctv.github.io
      - key: AITS_SERVICE_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_REASONING_EFFORT
        value: max
      - key: AITS_AI_PLAN_DATA_APPROVED
        value: "true"
